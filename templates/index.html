<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAP Sales Order Delivery Promise</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    header { background: linear-gradient(135deg, #0f62fe, #163b75); color: white; padding: 28px 40px; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px; }
    h1, h2, h3 { margin-top: 0; }
    .card { background: white; border: 1px solid #dfe5ef; border-radius: 16px; box-shadow: 0 12px 30px rgba(22, 59, 117, 0.08); margin-bottom: 22px; padding: 24px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #46566f; }
    input, textarea { border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font: inherit; padding: 11px 12px; width: 100%; }
    textarea { min-height: 82px; resize: vertical; }
    button { background: #0f62fe; border: 0; border-radius: 10px; color: white; cursor: pointer; font-weight: 800; padding: 12px 18px; }
    button:disabled { background: #96a6c1; cursor: not-allowed; }
    table { border-collapse: collapse; margin-top: 14px; width: 100%; }
    th, td { border-bottom: 1px solid #e5eaf2; padding: 10px; text-align: left; vertical-align: top; }
    th { color: #46566f; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
    tr:hover td { background: #f8fbff; }
    .actions { align-items: end; display: flex; gap: 12px; margin-top: 16px; }
    .muted { color: #60708b; }
    .pill { background: #e8f1ff; border-radius: 999px; color: #0f62fe; display: inline-block; font-size: 0.78rem; font-weight: 800; padding: 4px 10px; }
    .error { background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; padding: 12px; border-radius: 10px; }
    .answer { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 16px; white-space: pre-wrap; }
    pre { background: #0f172a; border-radius: 12px; color: #dbeafe; overflow: auto; padding: 16px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } main { padding: 16px; } header { padding: 24px; } }
  </style>
</head>
<body>
  <header>
    <span class="pill">SAP S/4HANA + Gemini</span>
    <h1>Sales Order Delivery Date Promise</h1>
    <p>Search SAP sales orders, review item details, select line items, and generate an AI-backed delivery promise.</p>
  </header>
  <main>
    <section class="card">
      <h2>1. Search Sales Order</h2>
      <div class="grid">
        <div>
          <label for="salesOrder">Sales order number</label>
          <input id="salesOrder" placeholder="Example: 1">
        </div>
        <div>
          <label for="creationDate">Sales order created date</label>
          <input id="creationDate" type="date">
        </div>
        <div>
          <label for="createdBy">Created by</label>
          <input id="createdBy" placeholder="Example: CFNANJA">
        </div>
      </div>
      <div class="actions">
        <button id="searchBtn">Fetch from SAP OData</button>
        <span id="searchStatus" class="muted"></span>
      </div>
      <div id="searchError"></div>
    </section>

    <section class="card" id="ordersCard" hidden>
      <h2>2. Sales Order Output & Item Selection</h2>
      <div id="ordersSummary"></div>
      <div id="itemsContainer"></div>
    </section>

    <section class="card" id="promiseCard" hidden>
      <h2>3. Delivery Promise</h2>
      <div class="grid">
        <div>
          <label for="customerNumber">Customer number</label>
          <input id="customerNumber" placeholder="Sold-to party from order">
        </div>
        <div>
          <label for="customerName">Customer name</label>
          <input id="customerName" placeholder="Optional customer name">
        </div>
        <div>
          <label for="selectedOrder">Selected sales order</label>
          <input id="selectedOrder" readonly>
        </div>
      </div>
      <div style="margin-top: 16px;">
        <label for="address">Delivery address</label>
        <textarea id="address" placeholder="Enter ship-to / delivery address required by the delivery date agent"></textarea>
      </div>
      <div class="actions">
        <button id="quoteBtn">Generate Delivery Date</button>
        <span id="quoteStatus" class="muted"></span>
      </div>
      <div id="quoteError"></div>
      <div id="answerBlock" hidden>
        <h3>AI Delivery Promise</h3>
        <div id="answer" class="answer"></div>
        <h3>Tool Trace</h3>
        <pre id="trace"></pre>
      </div>
    </section>
  </main>

  <script>
    const state = { orders: [], selectedOrder: null };

    const byId = (id) => document.getElementById(id);
    const htmlEscape = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));

    function selectedItems() {
      return Array.from(document.querySelectorAll("input[data-item-index]:checked")).map((checkbox) => {
        const orderIndex = Number(checkbox.dataset.orderIndex);
        const itemIndex = Number(checkbox.dataset.itemIndex);
        return state.orders[orderIndex].items[itemIndex];
      });
    }

    function renderOrders(orders) {
      state.orders = orders;
      byId("ordersCard").hidden = orders.length === 0;
      byId("promiseCard").hidden = orders.length === 0;
      byId("ordersSummary").innerHTML = `<p class="muted">Found ${orders.length} sales order(s). Select one or more item rows for the delivery date calculation.</p>`;
      byId("itemsContainer").innerHTML = orders.map((order, orderIndex) => `
        <article style="margin-top: 18px;">
          <h3>Sales Order ${htmlEscape(order.salesOrder)} <span class="pill">${htmlEscape(order.currency)} ${htmlEscape(order.totalNetAmount)}</span></h3>
          <p class="muted">
            Sold-to: <strong>${htmlEscape(order.soldToParty)}</strong> · Created: <strong>${htmlEscape(order.creationDate)}</strong> ·
            Created by: <strong>${htmlEscape(order.createdBy)}</strong> · Requested delivery: <strong>${htmlEscape(order.requestedDeliveryDate)}</strong>
          </p>
          <table>
            <thead>
              <tr>
                <th>Select</th><th>Item</th><th>Material</th><th>Description</th><th>Qty</th><th>Unit</th><th>Plant</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${order.items.map((item, itemIndex) => `
                <tr>
                  <td><input type="checkbox" data-order-index="${orderIndex}" data-item-index="${itemIndex}"></td>
                  <td>${htmlEscape(item.salesOrderItem)}</td>
                  <td>${htmlEscape(item.material)}</td>
                  <td>${htmlEscape(item.description)}</td>
                  <td>${htmlEscape(item.quantity)}</td>
                  <td>${htmlEscape(item.unit)}</td>
                  <td>${htmlEscape(item.plant)}</td>
                  <td>${htmlEscape(item.deliveryStatus)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </article>
      `).join("");

      document.querySelectorAll("input[data-item-index]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const first = selectedItems()[0];
          if (!first) return;
          const order = state.orders.find((candidate) => candidate.salesOrder === first.salesOrder) || state.orders[0];
          state.selectedOrder = order;
          byId("customerNumber").value = order.soldToParty || "";
          byId("selectedOrder").value = order.salesOrder || "";
        });
      });
    }

    byId("searchBtn").addEventListener("click", async () => {
      byId("searchError").innerHTML = "";
      byId("answerBlock").hidden = true;
      byId("searchStatus").textContent = "Loading sales order data...";
      byId("searchBtn").disabled = true;
      const params = new URLSearchParams();
      ["salesOrder", "creationDate", "createdBy"].forEach((id) => {
        const value = byId(id).value.trim();
        if (value) params.set(id, value);
      });
      try {
        const response = await fetch(`/api/sales-orders?${params.toString()}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Unable to fetch sales orders.");
        renderOrders(data.salesOrders || []);
        byId("searchStatus").textContent = `${data.count || 0} order(s) loaded.`;
      } catch (error) {
        byId("searchError").innerHTML = `<p class="error">${htmlEscape(error.message)}</p>`;
        byId("searchStatus").textContent = "";
      } finally {
        byId("searchBtn").disabled = false;
      }
    });

    byId("quoteBtn").addEventListener("click", async () => {
      byId("quoteError").innerHTML = "";
      byId("quoteStatus").textContent = "Calling delivery promise agent...";
      byId("quoteBtn").disabled = true;
      const lines = selectedItems();
      const payload = {
        salesOrder: byId("selectedOrder").value,
        customer: byId("customerName").value,
        customerNumber: byId("customerNumber").value,
        address: byId("address").value,
        lines,
      };
      try {
        const response = await fetch("/api/quote", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Unable to generate delivery date.");
        byId("answer").textContent = data.answer;
        byId("trace").textContent = JSON.stringify(data.toolTrace, null, 2);
        byId("answerBlock").hidden = false;
        byId("quoteStatus").textContent = `Completed in ${data.turns} Gemini turn(s), mode: ${data.mode}.`;
      } catch (error) {
        byId("quoteError").innerHTML = `<p class="error">${htmlEscape(error.message)}</p>`;
        byId("quoteStatus").textContent = "";
      } finally {
        byId("quoteBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
